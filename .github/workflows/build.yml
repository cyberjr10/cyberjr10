name: Stark Engine Native Build
on: [push]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v3

      - name: Set up Android NDK
        uses: nandroid7/setup-ndk@v1
        with:
          ndk-version: r25c

      - name: Build Native Binary
        run: |
          ndk-build LOCAL_PATH=. APP_BUILD_SCRIPT=Android.mk APP_PLATFORM=android-21

      - name: Package APK (Debug)
        run: |
          # This creates a simple wrapper so it functions as a standalone app
          mkdir -p StarkApp/assets
          cp stark_engine StarkApp/assets/
          # In a professional workflow, we'd use a template here, 
          # but for now, we are generating the raw binary.
          
      - name: Upload Stark Engine Binary
        uses: actions/upload-artifact@v3
        with:
          name: Stark-Native-Engine
          path: libs/**/*
          
