name: Sigma Engine Build
on: [push]

jobs:
  android_build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.21'

      - name: Install Fyne-cross
        run: go install fyne.io/fyne-cross@latest

      - name: Build APK
        run: |
          go mod tidy
          export PATH=$PATH:$(go env GOPATH)/bin
          fyne-cross android -app-id com.sigma.engine -silent
          
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Sigma-Engine-APK
          path: fyne-cross/dist/android/*.apk
          
